services:
  app:
    build:
      context: .
      dockerfile: web/Dockerfile
    container_name: ${APP_NAME}
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./web:/var/www/html/web
      - ./.env:/var/www/html/.env:ro
      - ./docker/00-arpache.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/security-hardening.conf:/etc/apache2/conf-enabled/zz-security-hardening.conf:ro
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Alias only — values come from .env once
      TZ: ${APP_TIMEZONE}
    networks:
      - app_network

  mariadb:
    image: mariadb:10.11
    container_name: ${DB_CONTAINER_NAME}
    ports:
      - "${DB_EXTERNAL_PORT}:3306"
    command:
      - --event-scheduler=ON
      - --default-time-zone=+07:00
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-database.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: ${PMA_CONTAINER_NAME}
    ports:
      - "${PMA_EXTERNAL_PORT}:80"
    env_file:
      - .env
    environment:
      TZ: ${APP_TIMEZONE}
      PMA_HOST: ${DB_HOST}
      PMA_PORT: ${DB_PORT}
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - app_network

volumes:
  mariadb_data:

networks:
  app_network:
    driver: bridge
