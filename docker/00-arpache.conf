<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/web

    <Directory /var/www/html/web>
        AllowOverride None
        Require all granted

        DirectoryIndex views/index.php

        RewriteEngine On

        # Block sensitive files in web root
        RewriteRule (^|/)(\.env|\.git|composer\.(json|lock)|vendor)(/|$) - [F,L,NC]

        # / → /views/index.php
        RewriteRule ^$ /views/index.php [L]

        # /api/* → /api/*.php (if file exists)
        RewriteCond %{REQUEST_URI} ^/api/([^/]+)$
        RewriteCond %{DOCUMENT_ROOT}/api/%1.php -f
        RewriteRule ^api/([^/]+)$ /api/%1.php [L]

        # /* → /views/*/index.php (if directory exists with index.php)
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_URI} ^/(.+)$
        RewriteCond %{DOCUMENT_ROOT}/views/%1/index.php -f
        RewriteRule ^(.+)$ /views/%1/index.php [L]

        # /* → /views/*.php (if file exists, skip /api/, support subdirectories)
        RewriteCond %{REQUEST_URI} !^/api/
        RewriteCond %{REQUEST_URI} ^/(.+)$
        RewriteCond %{DOCUMENT_ROOT}/views/%1.php -f
        RewriteRule ^(.+)$ /views/%1.php [L]
    </Directory>

    <FilesMatch "(?i)^(composer\.(json|lock)|\.env.*)$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "(?i)^.*/vendor(/|$)">
        Require all denied
    </DirectoryMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
        Header always unset X-Powered-By
        Header unset X-Powered-By
        # Best-effort; ServerTokens Prod is the reliable control
        Header unset Server
    </IfModule>

    ErrorDocument 404 /views/404.php

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
